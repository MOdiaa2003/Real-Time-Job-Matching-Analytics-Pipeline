# Remove the version: "3.9" line entirely

services:
  postgres:
    image: postgres:17
    container_name: my_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - spark-network

  redpanda:
    image: redpandadata/redpanda:${REDPANDA_IMAGE_TAG}
    container_name: ${REDPANDA_CONTAINER_NAME}
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --reserve-memory=0M
      - --check=false
      - --node-id=${REDPANDA_NODE_ID}
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:${KAFKA_EXTERNAL_PORT}
      - --advertise-kafka-addr=internal://${REDPANDA_CONTAINER_NAME}:29092,external://localhost:${KAFKA_EXTERNAL_PORT}
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=${REDPANDA_CONTAINER_NAME}:33145
      - --pandaproxy-addr=internal://0.0.0.0:8082
      - --advertise-pandaproxy-addr=internal://${REDPANDA_CONTAINER_NAME}:8082
    ports:
      - "${KAFKA_EXTERNAL_PORT}:${KAFKA_EXTERNAL_PORT}"
    networks:
      - spark-network

  console:
    image: redpandadata/console:latest
    container_name: redpanda-console
    depends_on:
      - redpanda
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "8084:8080"
    networks:
      - spark-network
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - spark-network
  kafka-connect:
    # Change '2.7' to '2.7.3.Final' or 'latest'
    image: debezium/connect:2.7.3.Final
    container_name: kafka-connect
    depends_on:
      - redpanda
      - postgres
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: redpanda:29092
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect
    networks:
      - spark-network
  


networks:
  spark-network:
    driver: bridge

volumes:
  spark-events:
  pgdata:
  qdrant_data: